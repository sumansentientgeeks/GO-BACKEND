services:
  - type: web
    name: hello-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Local TURN Server (Replace localhost with your actual public domain/IP for production)
      - key: TURN_SERVER_URL
        value: turn:localhost:3478
      - key: TURN_USERNAME
        value: myuser
      - key: TURN_CREDENTIAL
        value: mypassword
